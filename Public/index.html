
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside class="sidebar">
        <h2>🏥 MediCare</h2>
        <p>Hospital Management</p>

        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#" onclick="showSection('patients')">Patients</a>
            <a href="#" onclick="showSection('doctors')">Doctors</a>
            <a href="#" onclick="showSection('appointments')">Appointments</a>
        </nav>
    </aside>

    <main class="main">
        <header>
            <h1>Dashboard</h1>
            <p>Welcome to MediCare Hospital Management System</p>
        </header>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Patients</h3>
                <h1 id="patientCount">0</h1>
            </div>

            <div class="stat-card">
                <h3>Total Doctors</h3>
                <h1 id="doctorCount">0</h1>
            </div>

            <div class="stat-card">
                <h3>Appointments</h3>
                <h1 id="appointmentCount">0</h1>
            </div>
        </section>

        <section class="content">
            <h2>Quick Actions</h2>

            <button onclick="showSection('patients')">
                Register Patient
            </button>

            <button onclick="showSection('doctors')">
                View Doctors
            </button>

            <button onclick="showSection('appointments')">
                Book Appointment
            </button>
        </section>

        <section id="workspace" class="content">
            <h2>Welcome to MediCare</h2>
            <p>Select an option from the sidebar to get started.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
